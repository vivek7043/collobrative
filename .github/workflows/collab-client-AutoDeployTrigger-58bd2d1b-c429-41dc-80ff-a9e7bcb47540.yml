name: Trigger auto deployment for collab-client

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/collab-client-AutoDeployTrigger-58bd2d1b-c429-41dc-80ff-a9e7bcb47540.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.COLLABCLIENT_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.COLLABCLIENT_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.COLLABCLIENT_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}client
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: collabe.azurecr.io
          registryUsername: ${{ secrets.COLLABCLIENT_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.COLLABCLIENT_REGISTRY_PASSWORD }}
          containerAppName: collab-client
          resourceGroup: myapp-env
          imageToBuild: collabe.azurecr.io/collab-client:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


